[project]
name = "llm-design-bench"
version = "0.1.0"
description = "Reproducible offline optimization benchmarks for LLM data mixtures and synthetic black-box tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kaiyue Ma" },
]
keywords = [
    "benchmark",
    "black-box optimization",
    "data mixture optimization",
    "offline optimization",
    "large language models",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "bayeso-benchmarks>=0.2.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.20",
    "pydantic>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "seaborn>=0.13",
    "torch>=2.2",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Kaiyue2003/llm-design-bench"
Repository = "https://github.com/Kaiyue2003/llm-design-bench"
Issues = "https://github.com/Kaiyue2003/llm-design-bench/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=9.0.3",
    "twine>=5.0",
    "wheel>=0.43",
]

[project.scripts]
llm-design-bench = "llm_design_bench:main"
llm-design-bench-offline = "llm_design_bench.offline_cli:main"
llm-design-bench-publication = "llm_design_bench.publication_cli:main"
llm-design-bench-synthetic = "llm_design_bench.synthetic_cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_design_bench = ["py.typed"]

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=9.0.3",
    "twine>=5.0",
    "wheel>=0.43",
]
