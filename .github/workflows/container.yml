name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kaiyue2003/llm-design-bench
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the unified default CLI without training
        env:
          IMAGE_REF: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
        run: >-
          docker run --rm
          "$IMAGE_REF"
          methods
      - name: Exercise all 27 methods on invented data and verify resume
        env:
          IMAGE_REF: ${{ fromJSON(steps.metadata.outputs.json).tags[0] }}
        run: >-
          docker run --rm
          --volume "$RUNNER_TEMP/container-smoke:/results"
          --entrypoint python
          "$IMAGE_REF"
          /app/scripts/container_smoke.py --results-root /results
      - name: Save reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: container-smoke
          path: ${{ runner.temp }}/container-smoke
          if-no-files-found: ignore
